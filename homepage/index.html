        <script>
            // Wait for DOM content to load
            document.addEventListener('DOMContentLoaded', function() {
                // Change visibility when button clicked and change button text
                document.querySelector('#surprise-btn').addEventListener('click', function() {
                    if (document.querySelector('#surprise').style.visibility == "hidden") {
                        document.querySelector('#surprise').style.visibility = "visible";
                        document.querySelector('#surprise-btn').innerHTML = "Stop it!"
                    } else {
                        document.querySelector('#surprise').style.visibility = "hidden";
                        document.querySelector('#surprise-btn').innerHTML = "Hypnotize me!"
                    }
                });
            });
