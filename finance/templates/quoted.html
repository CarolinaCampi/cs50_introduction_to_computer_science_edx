{% extends "layout.html" %}

{% block title %}
    Quoted
{% endblock %}

{% block main %}
<h3 class="pb-5">Quote</h3>
    <table class="table">
        <thead>
            <tr>
                <th scope="col">Symbol</th>
                <th scope="col">Price</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>{{ price["symbol"] }}</td>
                <td>{{ price["price"] | usd }}</td>
            </tr>
        </tbody>
    </table>
{% endblock %}
